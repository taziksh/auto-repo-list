[project]
name = "auto-repo-list"
version = "0.1.0"
description = "Generate a simple public catalogue of code repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
repo-list = "auto_repo_list.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_repo_list*"]
